name: MNN Chat local API test build

on:
  push:
    branches: [feature/mnn-chat-local-api]
    paths:
      - 'apps/Android/MnnLlmChat/**'
      - '.github/workflows/mnn-chat-local-api.yml'
  # GitHub offers manual dispatch only after this file exists on the default
  # branch. Initial feature-branch builds use the exact push trigger above.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mnn-chat-local-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    if: github.repository == 'Naza3/MNN' && github.ref == 'refs/heads/feature/mnn-chat-local-api'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CI_TOOLS: apps/Android/MnnLlmChat/tools/local_api_ci
      REPORT_DIR: ${{ github.workspace }}/local-api-ci-report
      NATIVE_JOBS: '2'
    steps:
      - name: Check out the exact App commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Freeze and check out latest official stable release at job start
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          export MNN_ENGINE_SOURCE_ROOT="$RUNNER_TEMP/mnn-official-release"
          export MNN_ENGINE_INSTALL_ROOT="$MNN_ENGINE_SOURCE_ROOT/project/android/build_64"
          printf '%s\n' "MNN_ENGINE_SOURCE_ROOT=$MNN_ENGINE_SOURCE_ROOT" \
            "MNN_ENGINE_INSTALL_ROOT=$MNN_ENGINE_INSTALL_ROOT" >> "$GITHUB_ENV"
          python3 "$CI_TOOLS/preflight.py" --report-dir "$REPORT_DIR"
      - name: Use JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore the dedicated CI test signing identity
        id: test_key_cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mnn-local-api-test-signing/
          key: mnn-local-api-ci-test-signing-v1
      - name: Prepare a development-only test signing identity
        id: test_key
        env:
          CACHE_HIT: ${{ steps.test_key_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          umask 077
          key_dir="$RUNNER_TEMP/mnn-local-api-test-signing"
          mkdir -p "$key_dir"
          if [[ "$CACHE_HIT" == 'true' ]]; then
            test -s "$key_dir/test.p12"
          else
            test ! -e "$key_dir/test.p12"
            keytool -genkeypair -noprompt -storetype PKCS12 \
              -keystore "$key_dir/test.p12" -alias mnn-local-api-ci-test \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname 'CN=MNN Local API CI Test,OU=Development,O=MNN Chat API,C=CN'
          fi
          chmod 600 "$key_dir/test.p12"
          keytool -list -keystore "$key_dir/test.p12" -storepass android \
            -alias mnn-local-api-ci-test > /dev/null
      - name: Cache the CI test key before the build
        if: steps.test_key_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/mnn-local-api-test-signing/
          key: mnn-local-api-ci-test-signing-v1
      - name: Install exact Android packages using existing runner licenses
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          # Never run `yes | sdkmanager --licenses`. An unaccepted license
          # must stop this job and be reviewed separately.
          "$sdkmanager" --install 'platforms;android-35' 'platforms;android-34' \
            'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1' < /dev/null
          for entry in platforms/android-35/android.jar platforms/android-34/android.jar \
            build-tools/35.0.0/zipalign ndk/27.2.12479018/build/cmake/android.toolchain.cmake \
            cmake/3.22.1/bin/cmake; do test -f "$ANDROID_SDK_ROOT/$entry"; done
          java -version 2> "$REPORT_DIR/java-version.txt"
          "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --version > "$REPORT_DIR/cmake-version.txt"
          cp "$ANDROID_SDK_ROOT/ndk/27.2.12479018/source.properties" "$REPORT_DIR/ndk-version.txt"
          printf '%s\n' "runner_os=$RUNNER_OS" "runner_arch=$RUNNER_ARCH" \
            "image_version=${ImageVersion:-unknown}" > "$REPORT_DIR/runner.txt"
      - name: Test audit helpers with synthetic fixtures
        id: helpers
        run: python3 -m unittest discover -s "$CI_TOOLS" -p 'test_*.py' -v
      - name: Verify compiled APK metadata and optimized resource parsing
        id: apk_metadata
        run: |
          python3 "$CI_TOOLS/verify_apk_metadata.py" \
            --sdk "$ANDROID_SDK_ROOT" --report-dir "$REPORT_DIR"
      - name: Verify public test fixture provenance and real D8 credential scanning
        id: pem_scanner
        run: |
          python3 "$CI_TOOLS/verify_pem_scanner.py" \
            --sdk "$ANDROID_SDK_ROOT" --report-dir "$REPORT_DIR"
      - name: Verify App and TTS CMake use the same isolated engine roots
        id: engine_roots
        run: |
          python3 "$CI_TOOLS/verify_engine_roots.py" \
            --cmake "$ANDROID_SDK_ROOT/cmake/3.22.1/bin/cmake" --report-dir "$REPORT_DIR"
      - name: Verify Gradle CI task registration before native compilation
        id: gradle_init
        run: |
          bash "$CI_TOOLS/run_gradle.sh" --version > "$REPORT_DIR/gradle-version.txt"
          python3 "$CI_TOOLS/verify_gradle_init.py" \
            --wrapper "$RUNNER_TEMP/mnn-local-api-wrapper-$(id -u)/gradlew" \
            --report-dir "$REPORT_DIR" --negative-control
      - name: Build pinned official-release MNN arm64 engine
        id: native
        run: bash "$CI_TOOLS/build_native.sh"
      - name: Build source-locked Sherpa ASR JNI and preserve dependency notices
        id: sherpa
        run: bash "$CI_TOOLS/build_sherpa.sh"
      - name: Run local API unit and Robolectric tests
        id: api_tests
        continue-on-error: true
        run: |
          set -o pipefail
          bash "$CI_TOOLS/run_gradle.sh" :app:testStandardDebugUnitTest \
            --tests 'com.alibaba.mnnllm.api.openai.*'
      - name: Preserve focused test summary
        if: always() && steps.native.outcome == 'success' && steps.sherpa.outcome == 'success'
        run: |
          python3 "$CI_TOOLS/collect_reports.py" --report-dir "$REPORT_DIR"
          cp "$REPORT_DIR/test-summary.json" "$REPORT_DIR/local-api-test-summary.json"
      - name: Run all App unit tests (upstream regressions remain visible)
        id: all_tests
        if: always() && steps.native.outcome == 'success' && steps.sherpa.outcome == 'success'
        continue-on-error: true
        run: bash "$CI_TOOLS/run_gradle.sh" :app:testStandardDebugUnitTest
      - name: Lint standard release
        id: lint
        if: always() && steps.native.outcome == 'success' && steps.sherpa.outcome == 'success'
        continue-on-error: true
        run: bash "$CI_TOOLS/run_gradle.sh" :app:lintStandardRelease
      - name: Assemble unsigned standard arm64 APK
        id: assemble
        if: always() && steps.native.outcome == 'success' && steps.sherpa.outcome == 'success'
        continue-on-error: true
        run: |
          bash "$CI_TOOLS/run_gradle.sh" :app:assembleStandardRelease
          bash "$CI_TOOLS/run_gradle.sh" --version > "$REPORT_DIR/gradle-version.txt"
      - name: Audit the actual APK, native closure, and 16KiB alignment
        id: audit
        if: always() && steps.assemble.outcome == 'success'
        continue-on-error: true
        run: |
          mapfile -t apks < <(find apps/Android/MnnLlmChat/app/build/outputs/apk/standard/release -maxdepth 1 -name '*-unsigned.apk' -type f)
          test "${#apks[@]}" -eq 1
          python3 "$CI_TOOLS/audit_apk.py" --apk "${apks[0]}" \
            --sdk "$ANDROID_SDK_ROOT" --report-dir "$REPORT_DIR"
      - name: Inventory original external artifacts and explicit local project variants
        id: inventory
        if: always() && steps.native.outcome == 'success' && steps.sherpa.outcome == 'success'
        continue-on-error: true
        run: bash "$CI_TOOLS/run_gradle.sh" :app:localApiDependencyInventory
      - name: Collect small reports and available license notices
        id: reports
        if: always()
        run: python3 "$CI_TOOLS/collect_reports.py" --report-dir "$REPORT_DIR"
      - name: Record every stage outcome and enforce failures
        id: gate
        if: always()
        env:
          STEP_RESULTS: ${{ toJSON(steps) }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          steps = json.loads(os.environ['STEP_RESULTS'])
          expected = ['preflight', 'test_key', 'toolchain', 'helpers', 'apk_metadata', 'pem_scanner', 'engine_roots', 'gradle_init', 'sherpa', 'native', 'api_tests', 'all_tests', 'lint', 'assemble', 'audit', 'inventory', 'reports']
          outcomes = {name: steps.get(name, {}).get('outcome', 'not_run') for name in expected}
          out = pathlib.Path(os.environ['REPORT_DIR'])
          out.mkdir(parents=True, exist_ok=True)
          (out/'stage-outcomes.json').write_text(json.dumps(outcomes, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## MNN Chat local API test build\n\n')
              for name, outcome in outcomes.items():
                  f.write(f'- {name}: {outcome}\n')
              f.write('\nThe audited unsigned APK is preserved; a separate installable CI-test-signed copy follows only after this gate passes. Real-device inference/background survival and full license closure require separate verification. No release has been published.\n')
          failures = [name for name, outcome in outcomes.items() if outcome != 'success']
          for filename in ['local-api-test-summary.json', 'test-summary.json']:
              summary = out/filename
              suites = json.loads(summary.read_text()) if summary.exists() else []
              if sum(suite['tests'] for suite in suites) <= 0:
                  failures.append(filename+': no tests executed')
          if failures:
              raise SystemExit('Failed or unexecuted stages: '+', '.join(failures))
          PY
      - name: Sign and verify a separate installable CI test APK
        id: test_sign
        if: steps.gate.outcome == 'success' && steps.audit.outcome == 'success'
        run: |
          set -euo pipefail
          mapfile -t apks < <(find apps/Android/MnnLlmChat/app/build/outputs/apk/standard/release -maxdepth 1 -name '*-unsigned.apk' -type f)
          test "${#apks[@]}" -eq 1
          bash "$CI_TOOLS/sign_test_apk.sh" "${apks[0]}" \
            "$RUNNER_TEMP/mnn-local-api-test-signing/test.p12" \
            "$RUNNER_TEMP/mnn-local-api-signed-apk" "$REPORT_DIR"
      - name: Upload auditable reports (no credentials or user data)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mnn-chat-local-api-reports-${{ github.sha }}
          path: local-api-ci-report/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Upload unsigned APK for testing only
        if: always() && steps.gate.outcome == 'success' && steps.audit.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mnn-chat-local-api-unsigned-arm64-${{ github.sha }}
          path: apps/Android/MnnLlmChat/app/build/outputs/apk/standard/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Upload the installable CI test APK and checksum
        id: signed_artifact
        if: steps.test_sign.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mnn-chat-local-api-ci-test-signed-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mnn-local-api-signed-apk/MNN-Chat-API-arm64-ci-test.apk
            ${{ runner.temp }}/mnn-local-api-signed-apk/MNN-Chat-API-arm64-ci-test.apk.sha256
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Link the installable test APK and its public signing identity
        if: steps.signed_artifact.outcome == 'success'
        env:
          ARTIFACT_URL: ${{ steps.signed_artifact.outputs.artifact-url }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          report = json.loads((pathlib.Path(os.environ['REPORT_DIR'])/'signed-test-apk.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n### Installable CI test APK\n\n')
              output.write('[Download signed APK and SHA-256]('+os.environ['ARTIFACT_URL']+')\n\n')
              output.write('- APK SHA-256: `'+report['signed_apk_sha256']+'`\n')
              output.write('- Public certificate SHA-256: `'+report['certificate_sha256']+'`\n')
              output.write('\nThis is a dedicated cached test key, not the installed App\'s known signing identity. An update requires matching certificates; cache loss creates a different identity. The keystore is never uploaded as an artifact.\n')
          PY
